databaseChangeLog:
  - changeSet:
      id: roles-table
      author: vitaliy
      changes:

        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: role_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

        - createIndex:
            tableName: roles
            indexName: idx_roles_name
            columns:
              - column:
                  name: role_name
