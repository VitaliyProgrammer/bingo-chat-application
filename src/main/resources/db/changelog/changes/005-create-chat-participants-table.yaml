databaseChangeLog:
  - changeSet:
      id: chat-participants
      author: vitaliy
      changes:

        - createTable:
            tableName: chat_participants
            columns:
              - column:
                  name: chat_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            columnNames: chat_id, user_id
            tableName: chat_participants

        - createIndex:
            tableName: chat_participants
            indexName: idx_chat_participants_user_id
            columns:
              - column:
                  name: user_id

        - addForeignKeyConstraint:
            baseTableName: chat_participants
            baseColumnNames: chat_id
            referencedTableName: chats
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: chat_participants
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
