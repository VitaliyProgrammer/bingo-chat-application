databaseChangeLog:
  - changeSet:
      id: chat
      author: vitaliy
      changes:

        - createTable:
            tableName: chats
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: chat_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: last_activity_time
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: last_message_text
                  type: VARCHAR(2000)

              - column:
                  name: last_message_sequence
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - createIndex:
            tableName: chats
            indexName: idx_chats_last_activity
            columns:
              - column:
                  name: last_activity_time

        - createIndex:
            tableName: chats
            indexName: idx_chats_owner_id
            columns:
              - column:
                  name: owner_id

        - addUniqueConstraint:
            tableName: chats
            columnNames: owner_id, chat_type
            constraintName: uk_chat_owner_type
