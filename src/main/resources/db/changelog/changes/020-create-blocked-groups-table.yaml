databaseChangeLog:
  - changeSet:
      id: create-blocked-groups-table
      author: vitaliy
      changes:

        - createTable:
            tableName: blocked_groups
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: chat_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: blocked_by_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: reason
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: blocked_at
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: unblocked_by_id
                  type: BIGINT

              - column:
                  name: unblocked_at
                  type: DATETIME

        - createIndex:
            tableName: blocked_groups
            indexName: idx_blocked_groups_chat
            columns:
              - column:
                  name: chat_id

        - addForeignKeyConstraint:
            baseTableName: blocked_groups
            baseColumnNames: chat_id
            referencedTableName: chats
            referencedColumnNames: id
            constraintName: fk_blocked_groups_chat
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: blocked_groups
            baseColumnNames: blocked_by_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_blocked_groups_blocked_by

        - addForeignKeyConstraint:
            baseTableName: blocked_groups
            baseColumnNames: unblocked_by_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_blocked_groups_unblocked_by
