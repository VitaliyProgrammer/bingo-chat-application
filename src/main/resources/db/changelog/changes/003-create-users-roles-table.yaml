databaseChangeLog:
  - changeSet:
      id: users-roles
      author: vitaliy
      changes:

        - createTable:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            columnNames: user_id, role_id
            tableName: users_roles

        - createIndex:
            tableName: users_roles
            indexName: idx_users_roles_role_id
            columns:
              - column:
                  name: role_id

        - addForeignKeyConstraint:
            baseTableName: users_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: users_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            onDelete: CASCADE
