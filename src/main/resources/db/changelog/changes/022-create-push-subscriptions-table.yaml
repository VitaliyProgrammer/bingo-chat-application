databaseChangeLog:
  - changeSet:
      id: create-push-subscriptions-table
      author: vitaliy
      changes:

        - createTable:
            tableName: push_subscriptions
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: endpoint
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: p256dh_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: auth_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false

        - createIndex:
            tableName: push_subscriptions
            indexName: idx_push_subscriptions_user
            columns:
              - column:
                  name: user_id

        - addForeignKeyConstraint:
            baseTableName: push_subscriptions
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_push_subscriptions_user
            onDelete: CASCADE
